name: Chisel Mobile Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'chisel-android/**'
      - '.github/workflows/android-mobile-build.yml'
  pull_request:
    paths:
      - 'chisel-android/**'
      - '.github/workflows/android-mobile-build.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: chisel-android

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Install dependencies and refresh lockfile in workspace
        run: npm install --no-audit --no-fund

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Verify synchronized app shell
        run: |
          test -f android/app/src/main/assets/public/index.html
          cmp --silent www/index.html android/app/src/main/assets/public/index.html

      - name: Run automated tests
        run: npm test

      - name: Build debug APK and release AAB
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug bundleRelease --stacktrace

      - name: Upload mobile build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chisel-mobile-build-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: |
            chisel-android/android/app/build/outputs/apk/debug/app-debug.apk
            chisel-android/android/app/build/outputs/bundle/release/app-release.aab
