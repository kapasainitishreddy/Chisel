name: Chisel Mobile Build

on:
  workflow_dispatch:
    inputs:
      signed_release:
        description: Build signed release using configured upload credentials
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: chisel-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: chisel-android

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'build-tools;35.0.0'

      - name: Install frozen dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Verify synchronized app shell
        run: |
          test -f android/app/src/main/assets/public/index.html
          cmp --silent www/index.html android/app/src/main/assets/public/index.html

      - name: Run automated tests
        run: npm test

      - name: Build debug APK
        run: |
          cd android
          bash gradlew assembleDebug --stacktrace

      - name: Upload mobile build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chisel-mobile-build-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: |
            chisel-android/android/app/build/outputs/apk/debug/app-debug.apk
            chisel-android/package-lock.json
            chisel-android/android/capacitor.settings.gradle
            chisel-android/android/app/capacitor.build.gradle

  signed-release:
    if: ${{ inputs.signed_release }}
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: chisel-android
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'build-tools;35.0.0'

      - name: Install frozen dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Verify synchronized app shell
        run: |
          test -f android/app/src/main/assets/public/index.html
          cmp --silent www/index.html android/app/src/main/assets/public/index.html

      - name: Validate web build
        run: npm run build

      - name: Configure developer-owned signing and build
        env:
          CHISEL_UPLOAD_KEYSTORE: ${{ secrets.CHISEL_UPLOAD_KEYSTORE }}
          CHISEL_STORE_PASSWORD: ${{ secrets.CHISEL_STORE_PASSWORD }}
          CHISEL_KEY_ALIAS: ${{ secrets.CHISEL_KEY_ALIAS }}
          CHISEL_KEY_PASSWORD: ${{ secrets.CHISEL_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          trap 'rm -f android/release-upload.jks android/keystore.properties' EXIT
          python3 - <<'PYCODE'
          import os, base64, pathlib
          names=['CHISEL_UPLOAD_KEYSTORE','CHISEL_STORE_PASSWORD','CHISEL_KEY_ALIAS','CHISEL_KEY_PASSWORD']
          if any(not os.environ.get(n) for n in names):
              raise SystemExit('Developer-owned upload signing credentials are incomplete')
          pathlib.Path('android/release-upload.jks').write_bytes(base64.b64decode(os.environ[names[0]], validate=True))
          def escape(v):
              return v.replace('\\','\\\\').replace('\n','\\n').replace('\r','\\r').replace('=','\\=').replace(':','\\:').replace(' ','\\ ')
          props='storeFile=release-upload.jks\n'+''.join(k+'='+escape(os.environ[n])+'\n' for k,n in zip(['storePassword','keyAlias','keyPassword'],names[1:]))
          pathlib.Path('android/keystore.properties').write_text(props)
          for p in ['android/release-upload.jks','android/keystore.properties']: pathlib.Path(p).chmod(0o600)
          PYCODE
          cd android
          bash gradlew bundleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: chisel-signed-release-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: chisel-android/android/app/build/outputs/bundle/release/app-release.aab
