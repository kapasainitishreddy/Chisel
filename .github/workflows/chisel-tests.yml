name: Chisel Tests

on:
  push:
    paths:
      - 'chisel-android/**'
      - '.github/workflows/chisel-tests.yml'
  pull_request:
    paths:
      - 'chisel-android/**'
      - '.github/workflows/chisel-tests.yml'

permissions:
  contents: read

jobs:
  enhancements:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    defaults:
      run:
        working-directory: chisel-android
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check www/chisel-ar-coach-core.js
          node --check www/chisel-beauty-studio.js
          node --check www/chisel-tryon-runtime-fixes.js
          node --check www/chisel-enhancements-core.js
          node --check www/chisel-enhancements.js
          node --check www/chisel-precision-stats.js
          node --check www/chisel-precision-protocol.js
          node --check www/chisel-precision-core.js
          node --check www/chisel-precision-face.js
          node --check www/chisel-precision-body.js
          node --check www/chisel-precision-ui.js
          node --check www/chisel-precision.js
          node --check www/chisel-scan-guard.js
          node --check www/chisel-experience-polish.js
          node --check www/chisel-product-polish.js
          node --check tests/portrait-qa-runner.mjs
          node --check tests/tryon-visual-runner.mjs
      - name: Run automated tests
        run: npm test

  tryon-visual-qa:
    needs: enhancements
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        gender: [male, female]
    defaults:
      run:
        working-directory: chisel-android
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install visual QA browser controller
        run: npm install --no-save --package-lock=false puppeteer-core@24
      - name: Render ${{ matrix.gender }} try-ons
        shell: bash
        run: |
          set -uo pipefail
          command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "Chrome/Chromium is required for visual try-on QA" >&2
            exit 1
          fi
          export CHROME
          gender="${{ matrix.gender }}"
          rm -f "/tmp/chisel-${gender}-visual-tryon.json" /tmp/chisel-${gender}-visual-*.png /tmp/chisel-visual-http.log
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/chisel-visual-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1
          if [ "$gender" = "male" ]; then
            VIDEO_FILTER="crop=iw/1.25:ih/1.25:(iw-iw/1.25)/2:(ih-ih/1.25)/2-12,scale=320:400:force_original_aspect_ratio=decrease,pad=320:400:(ow-iw)/2:(oh-ih)/2:color=gray,format=yuv420p"
          else
            VIDEO_FILTER="scale=320:400:force_original_aspect_ratio=decrease,pad=320:400:(ow-iw)/2:(oh-ih)/2:color=gray,format=yuv420p"
          fi
          ffmpeg -hide_banner -loglevel error -y -loop 1 \
            -i "tests/fixtures/portrait-${gender}.jpg" \
            -vf "$VIDEO_FILTER" -r 20 -frames:v 60 -f yuv4mpegpipe "/tmp/chisel-${gender}-visual.y4m"
          timeout --signal=TERM --kill-after=10s 150s \
            node tests/tryon-visual-runner.mjs "$gender" "/tmp/chisel-${gender}-visual.y4m" "http://127.0.0.1:4173"
      - name: Upload ${{ matrix.gender }} visual try-on evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-tryon-${{ matrix.gender }}
          path: |
            /tmp/chisel-${{ matrix.gender }}-visual-tryon.json
            /tmp/chisel-${{ matrix.gender }}-visual-*.png
            /tmp/chisel-visual-http.log
          if-no-files-found: warn
          retention-days: 7

  portrait-qa:
    needs: enhancements
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        gender: [male, female]
    defaults:
      run:
        working-directory: chisel-android
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install portrait QA browser controller
        run: npm install --no-save --package-lock=false puppeteer-core@24
      - name: Run ${{ matrix.gender }} generated-portrait QA
        shell: bash
        run: |
          set -uo pipefail
          command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "Chrome/Chromium is required for portrait QA" >&2
            exit 1
          fi
          export CHROME
          gender="${{ matrix.gender }}"
          rm -f "/tmp/chisel-${gender}-qa.html" "/tmp/chisel-${gender}-chrome.log" "/tmp/chisel-${gender}-result.txt" "/tmp/chisel-${gender}-tryon-result.json" /tmp/chisel-http.log /tmp/chisel-${gender}-tryon-*.png
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/chisel-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1
          if [ "$gender" = "male" ]; then
            VIDEO_FILTER="crop=iw/1.25:ih/1.25:(iw-iw/1.25)/2:(ih-ih/1.25)/2-12,scale=320:400:force_original_aspect_ratio=decrease,pad=320:400:(ow-iw)/2:(oh-ih)/2:color=gray,format=yuv420p"
          else
            VIDEO_FILTER="scale=320:400:force_original_aspect_ratio=decrease,pad=320:400:(ow-iw)/2:(oh-ih)/2:color=gray,format=yuv420p"
          fi
          ffmpeg -hide_banner -loglevel error -y -loop 1 \
            -i "tests/fixtures/portrait-${gender}.jpg" \
            -vf "$VIDEO_FILTER" -r 20 -frames:v 60 -f yuv4mpegpipe "/tmp/chisel-${gender}.y4m"
          timeout --signal=TERM --kill-after=10s 120s \
            node tests/portrait-qa-runner.mjs "$gender" "/tmp/chisel-${gender}.y4m" "http://127.0.0.1:4173"
      - name: Upload ${{ matrix.gender }} portrait QA diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portrait-qa-${{ matrix.gender }}
          path: |
            /tmp/chisel-${{ matrix.gender }}-qa.html
            /tmp/chisel-${{ matrix.gender }}-chrome.log
            /tmp/chisel-${{ matrix.gender }}-result.txt
            /tmp/chisel-${{ matrix.gender }}-tryon-result.json
            /tmp/chisel-${{ matrix.gender }}-tryon-*.png
            /tmp/chisel-http.log
          if-no-files-found: warn
          retention-days: 7
