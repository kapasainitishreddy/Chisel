name: Chisel Tests

on:
  push:
    paths:
      - 'chisel-android/**'
      - '.github/workflows/chisel-tests.yml'
  pull_request:
    paths:
      - 'chisel-android/**'
      - '.github/workflows/chisel-tests.yml'

permissions:
  contents: read

jobs:
  enhancements:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chisel-android
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check www/chisel-ar-coach-core.js
          node --check www/chisel-beauty-studio.js
          node --check www/chisel-tryon-runtime-fixes.js
          node --check www/chisel-enhancements-core.js
          node --check www/chisel-enhancements.js
          node --check www/chisel-precision-stats.js
          node --check www/chisel-precision-protocol.js
          node --check www/chisel-precision-core.js
          node --check www/chisel-precision-face.js
          node --check www/chisel-precision-body.js
          node --check www/chisel-precision-ui.js
          node --check www/chisel-precision.js
          node --check www/chisel-scan-guard.js
          node --check www/chisel-experience-polish.js
          node --check www/chisel-product-polish.js
          node --check tests/portrait-qa-runner.mjs
      - name: Run automated tests
        run: npm test
      - name: Install portrait QA browser controller
        run: npm install --no-save --package-lock=false puppeteer-core@24
      - name: Run AI-generated male and female portrait QA
        shell: bash
        run: |
          set -uo pipefail
          command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "Chrome/Chromium is required for portrait QA" >&2
            exit 1
          fi
          export CHROME

          rm -f /tmp/chisel-*-qa.html /tmp/chisel-*-chrome.log /tmp/chisel-*-result.txt /tmp/chisel-http.log
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/chisel-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1
          STATUS=0

          for gender in male female; do
            ffmpeg -hide_banner -loglevel error -y -loop 1 \
              -i "tests/fixtures/portrait-${gender}.jpg" \
              -vf "scale=320:400:force_original_aspect_ratio=decrease,pad=320:400:(ow-iw)/2:(oh-ih)/2:color=gray,format=yuv420p" \
              -r 20 -t 25 -f yuv4mpegpipe "/tmp/chisel-${gender}.y4m"

            if ! node tests/portrait-qa-runner.mjs "$gender" "/tmp/chisel-${gender}.y4m" "http://127.0.0.1:4173"; then
              STATUS=1
            fi
          done

          if [ "$STATUS" -ne 0 ]; then
            echo "===== local HTTP log =====" >&2
            cat /tmp/chisel-http.log >&2 || true
          fi
          exit "$STATUS"
      - name: Upload portrait QA diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portrait-qa-diagnostics
          path: |
            /tmp/chisel-male-qa.html
            /tmp/chisel-female-qa.html
            /tmp/chisel-male-chrome.log
            /tmp/chisel-female-chrome.log
            /tmp/chisel-male-result.txt
            /tmp/chisel-female-result.txt
            /tmp/chisel-http.log
          if-no-files-found: warn
          retention-days: 7
